<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1230">
<title>Hordebreak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* One-screen arcade game: a portrait stage centred on a deep navy field,
     menus as cards pinned to the bottom so the 3D road stays visible above. */
  --ink: #0b1230;
  --panel: #121c44;
  --line: #2b3a74;
  --text: #eef3ff;
  --muted: #a3b3e0;
  --accent: #ffb21e;
  --ally: #2f9bff;
  --foe: #f0454d;
  --good: #3ddc97;
  --display: "Chakra Petch", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --body: "Chakra Petch", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--body);
  font-weight: 500;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#app {
  height: 100%;
  display: flex;
  justify-content: center;
}

#stage {
  position: relative;
  height: 100%;
  aspect-ratio: 9 / 16;
  max-width: 100%;
  overflow: hidden;
  background: #9eccE6;
  touch-action: none;
}

#gl, #labels {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#labels { pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fff6e0; opacity: 0; pointer-events: none; }

#ui { position: absolute; inset: 0; pointer-events: none; }
#ui button, #ui .list { pointer-events: auto; }

/* ---------- shared pieces ---------- */
.coin {
  display: inline-block;
  width: 0.95em;
  height: 0.95em;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--accent) 60%, #c9790a);
  box-shadow: inset 0 0 0 0.09em rgba(120, 66, 0, 0.55);
  vertical-align: -0.12em;
  margin-right: 0.35em;
}

.coin-pill {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(11, 18, 48, 0.78);
  border: 1px solid var(--line);
  font-family: var(--display);
  font-weight: 700;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}

.btn {
  font: 700 17px var(--display);
  color: var(--text);
  background: #1c2a5f;
  border: 1px solid var(--line);
  border-bottom-width: 3px;
  border-radius: 12px;
  padding: 13px 16px;
  width: 100%;
  cursor: pointer;
  letter-spacing: 0.02em;
}
.btn:active { transform: translateY(1px); border-bottom-width: 2px; }
.btn:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--ally); outline-offset: 2px; }
.btn.primary {
  background: var(--accent);
  border-color: #b96f00;
  color: #2a1700;
  font-size: 20px;
  padding: 15px 16px;
}
.btn.nudge { border-color: var(--good); box-shadow: 0 0 0 2px rgba(61, 220, 151, 0.45); }
.btn.small { width: auto; font-size: 15px; padding: 8px 14px; border-radius: 10px; white-space: nowrap; }
.btn.buy { background: #24439a; border-color: #3f63c9; }
.btn[disabled] { opacity: 0.45; cursor: default; }

.icon-btn {
  font: 700 15px var(--display);
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(11, 18, 48, 0.78);
  color: var(--text);
  cursor: pointer;
}
.icon-btn.off { color: #5d6a99; text-decoration: line-through; }

.badge {
  display: inline-block;
  min-width: 22px;
  padding: 1px 6px;
  margin-left: 6px;
  border-radius: 999px;
  background: var(--good);
  color: #04301c;
  font-size: 13px;
}

.tag {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 6px;
  background: #24439a;
  font: 700 13px var(--display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  vertical-align: 0.2em;
}
.tag.foe { background: var(--foe); }

.bar {
  height: 8px;
  border-radius: 999px;
  background: rgba(11, 18, 48, 0.7);
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.16);
}
.bar-fill { height: 100%; width: 0; background: var(--ally); border-radius: 999px; }
.bar.foe .bar-fill { background: var(--foe); }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; }
.hud-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: max(12px, env(safe-area-inset-top)) 16px 0;
}
.hud-level { flex: 1; display: flex; flex-direction: column; gap: 5px; font: 700 15px var(--display); text-shadow: 0 1px 2px rgba(11, 18, 48, 0.8); }
.boss-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px 0; font: 700 13px var(--display); letter-spacing: 0.1em; text-shadow: 0 1px 2px rgba(11, 18, 48, 0.8); }
.boss-bar .bar { flex: 1; height: 12px; }
.buffs { position: absolute; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.chip { padding: 4px 9px; border-radius: 8px; font: 700 12px var(--display); letter-spacing: 0.05em; background: rgba(11, 18, 48, 0.8); border: 1px solid var(--line); }
.chip.dmg { color: #ffb37a; }
.chip.rate { color: #c9a9ff; }
.chip.multi { color: #9af2c6; }

.toast {
  position: absolute;
  left: 50%;
  top: 22%;
  transform: translateX(-50%);
  padding: 9px 18px;
  border-radius: 10px;
  background: rgba(11, 18, 48, 0.86);
  border: 1px solid var(--line);
  font: 700 18px var(--display);
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.toast.pop { animation: pop 0.25s ease-out; }
@keyframes pop { from { transform: translateX(-50%) scale(0.8); } to { transform: translateX(-50%) scale(1); } }

.hint {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 9%;
  text-align: center;
  font: 700 18px/1.4 var(--display);
  text-shadow: 0 2px 4px rgba(11, 18, 48, 0.9);
}

/* ---------- screens ---------- */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  background: linear-gradient(to bottom, rgba(11, 18, 48, 0.1) 0%, rgba(11, 18, 48, 0.2) 35%, rgba(11, 18, 48, 0.9) 78%);
}
.screen[hidden], .hud[hidden], [hidden] { display: none !important; }
.spacer { flex: 1; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topline h2 { margin: 0; font: 700 20px var(--display); letter-spacing: 0.06em; text-transform: uppercase; }

.panel { display: flex; flex-direction: column; gap: 12px; }

.title {
  margin: 0;
  font: 700 clamp(40px, 13vw, 58px)/0.95 var(--display);
  letter-spacing: 0.01em;
  text-shadow: 0 3px 0 rgba(11, 18, 48, 0.55);
}
.title span { color: var(--accent); }
.level-line { margin: 0; font: 700 26px var(--display); }
.brief { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; max-width: 40ch; text-wrap: pretty; }

.kit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 2px 0; }
.kit div { background: rgba(18, 28, 68, 0.85); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.kit dt { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.kit dd { margin: 2px 0 0; font: 700 15px var(--display); font-variant-numeric: tabular-nums; overflow-wrap: break-word; }

.verdict { margin: 0; font: 700 clamp(44px, 14vw, 62px)/1 var(--display); color: var(--accent); text-transform: uppercase; text-shadow: 0 3px 0 rgba(11, 18, 48, 0.55); }
.verdict.lose { color: var(--foe); }
.verdict.small { font-size: 34px; color: var(--text); }
.reward { font: 700 34px var(--display); font-variant-numeric: tabular-nums; }
.unlocks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.unlocks p { margin: 0 4px 0 0; width: 100%; font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--good); }
.unlocks .tag { background: #0f6a45; }

.result { background: linear-gradient(to bottom, rgba(11, 18, 48, 0.35) 0%, rgba(11, 18, 48, 0.92) 62%); }
.pause { justify-content: center; background: rgba(11, 18, 48, 0.82); }

/* ---------- armory ---------- */
.armory { background: var(--ink); padding-bottom: 0; }
.list { flex: 1; overflow-y: auto; margin: 12px -16px 0; padding: 0 16px max(24px, env(safe-area-inset-bottom)); touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.list h3 { margin: 18px 0 8px; font: 700 13px var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.next-unlock { margin: 4px 0 0; padding: 9px 12px; border-radius: 10px; background: rgba(61, 220, 151, 0.1); border: 1px solid rgba(61, 220, 151, 0.35); font-size: 14px; color: #b9f3d8; }
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  margin-bottom: 8px;
  min-height: 62px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
}
.row.active { border-color: var(--accent); }
.row.locked { opacity: 0.55; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-text strong { font: 700 16px var(--display); }
.row-text span { font-size: 13px; color: var(--muted); line-height: 1.35; }
.row-text em { font-style: normal; color: #cdd8ff; white-space: nowrap; }
.lock, .equipped { font: 700 13px var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.equipped { color: var(--accent); }

/* ---------- portraits (rendered in Blender) ---------- */
.thumb { width: 56px; height: 56px; flex: none; border-radius: 10px; background: radial-gradient(circle at 50% 38%, #2f437f, #17224f 72%); }
.row.locked .thumb { filter: grayscale(1) brightness(0.7); }
.kit .has-thumb { position: relative; }
.kit .has-thumb dt { padding-right: 36px; min-height: 26px; }
.kit .has-thumb .thumb { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border-radius: 8px; }
.kit dd.big { font-size: 22px; line-height: 1; }

/* ---------- airstrike button ---------- */
.strike {
  --p: 0%;
  position: absolute;
  right: 16px;
  bottom: max(16px, env(safe-area-inset-bottom));
  width: 84px;
  height: 84px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: rgba(11, 18, 48, 0.82);
  color: var(--text);
  font: 700 13px var(--display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  overflow: hidden;
  cursor: default;
  padding: 0;
}
.strike-fill {
  position: absolute;
  inset: auto 0 0 0;
  height: var(--p);
  background: linear-gradient(to top, #b3441a, var(--accent));
  opacity: 0.55;
}
.strike-label { position: relative; }
.strike.ready {
  border-color: var(--accent);
  color: #2a1700;
  cursor: pointer;
  animation: strike-pulse 0.9s ease-in-out infinite alternate;
}
.strike.ready .strike-fill { opacity: 1; }
.strike:focus-visible { outline: 3px solid var(--ally); outline-offset: 2px; }
@keyframes strike-pulse { from { box-shadow: 0 0 0 0 rgba(255, 178, 30, 0.55); } to { box-shadow: 0 0 0 12px rgba(255, 178, 30, 0); } }

/* ---------- medals ---------- */
.stars { display: flex; gap: 8px; }
.stars i {
  width: 34px;
  height: 34px;
  background: #2b3a74;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.stars i.on { background: var(--accent); animation: star-in 0.35s ease-out backwards; }
@keyframes star-in { from { transform: scale(2.2) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .toast.pop, .strike.ready, .stars i.on { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="labels"></canvas>
    <div id="ui"></div>
  </div>
</div>
<script>
